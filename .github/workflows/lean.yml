name: lean-flagship

# Kernel-checks the parameter-bounded steady-state flagship proof (lean/) against
# Mathlib. GitHub-hosted runners have open network, so Mathlib's prebuilt .olean
# cache resolves here even though it is firewalled in the dev sandbox.

on:
  push:
    paths:
      - "lean/**"
      - ".github/workflows/lean.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan (Lean toolchain manager)
        run: |
          curl -fsSL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve deps, fetch Mathlib cache, build (kernel-checks the proof)
        working-directory: lean
        run: |
          lake update
          lake exe cache get
          lake build

      - name: Confirm the proof object was produced and is sorry-free
        working-directory: lean
        run: |
          test -f .lake/build/lib/lean/BslLean/ReversibleTwoSpecies.olean
          ! grep -RnE '\b(sorry|admit)\b' BslLean/ || (echo "found sorry/admit" && exit 1)
          echo "kernel-checked: BslLean.ReversibleTwoSpecies"
